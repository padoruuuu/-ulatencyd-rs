[workspace]
members = [
"crates/core",
"crates/procmon",
"crates/cgroupv2",
"crates/rules",
"crates/dbus-api",
"crates/psi",
"crates/cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "=4.1.2", default-features = false, features = ["tokio"] }
toml = "0.7"
nix = { version = "0.27", features = ["signal", "process", "fs", "sched", "resource"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
wildmatch = "2"
itoa = "1"

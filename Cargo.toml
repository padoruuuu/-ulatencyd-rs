[workspace]
members = [
"crates/core",
"crates/procmon",
"crates/cgroupv2",
"crates/rules",
"crates/psi",
"crates/cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_derive = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.27", features = ["signal", "process", "fs", "sched", "resource"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
wildmatch = "2"
itoa = "1"
# Drives the daemon's own SIGTERM/SIGINT/SIGHUP thread (crates/core/src/signal.rs)
# now that there's no tokio runtime to provide tokio::signal::unix.
signal-hook = "0.3"
varlink = "13"
varlink_generator = "13"

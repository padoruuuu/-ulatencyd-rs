[package]
name    = "ulatencyd-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ulatencyd"
path = "src/main.rs"

[build-dependencies]
varlink_generator = { workspace = true }

[dependencies]
procmon   = { path = "../procmon" }
cgroupv2  = { path = "../cgroupv2" }
psi       = { path = "../psi" }
rules     = { path = "../rules" }
anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
tracing-subscriber = { workspace = true }
serde     = { workspace = true }
libc      = { workspace = true }
nix       = { workspace = true }
clap      = { workspace = true }
signal-hook = { workspace = true }
# Sync mode now (see crates/control-proto/README.md) — the control socket
# runs a blocking varlink::listen() server on its own thread, matching
# crates/cli, so no "tokio" feature is needed here anymore.
varlink        = { workspace = true }
serde_derive   = { workspace = true }
serde_json     = { workspace = true }

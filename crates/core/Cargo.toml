[package]
name    = "ulatencyd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ulatencyd"
path = "src/main.rs"

[dependencies]
procmon   = { path = "../procmon" }
cgroupv2  = { path = "../cgroupv2" }
psi       = { path = "../psi" }
rules     = { path = "../rules" }
dbus-api  = { path = "../dbus-api" }
tokio     = { workspace = true }
anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
tracing-subscriber = { workspace = true }
serde     = { workspace = true }
toml      = { workspace = true }
libc      = { workspace = true }
nix       = { workspace = true }
zbus      = { workspace = true }
clap      = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

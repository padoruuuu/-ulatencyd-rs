[package]
name    = "ulatencyctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ulatencyctl"
path = "src/main.rs"

[build-dependencies]
varlink_generator = { workspace = true }

[dependencies]
anyhow  = { workspace = true }
clap    = { workspace = true }
libc    = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde   = { workspace = true }
serde_derive = { workspace = true }
serde_json   = { workspace = true }
# Sync client only — no tokio feature needed in this binary.
varlink = { workspace = true }

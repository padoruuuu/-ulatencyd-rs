# rules/40-browsers.toml
# Browsers and Electron apps.
#
# These are explicitly classified so they get placed in `interactive` and
# are never accidentally throttled by the fork-bomb detector or swapstorm tier.
# Browsers spawn many processes (content, GPU, network, utility) rapidly at
# startup — they must not be treated as fork bombs.

[[rule]]
name     = "firefox"
priority = 60

[rule.match]
comm = ["firefox", "firefox-bin", "firefox-esr"]

[rule.action]
cgroup            = "interactive"
oom_score_adj     = 200
apply_to_children = true

[[rule]]
name     = "firefox-content"
priority = 58

[rule.match]
parent_comm    = ["firefox", "firefox-bin", "firefox-esr"]
comm_prefix    = ["Web Content", "Privileged Cont", "WebExtensions",
                  "RDD Process", "Socket Process", "Utility Process",
                  "GMP Plugin", "Sandbox Forked"]

[rule.action]
cgroup        = "interactive"
oom_score_adj = 300

[[rule]]
name     = "chromium"
priority = 60

[rule.match]
comm = ["chromium", "chromium-browser", "chrome", "google-chrome",
        "google-chrome-stable", "brave", "brave-browser",
        "microsoft-edge", "vivaldi", "opera"]

[rule.action]
cgroup            = "interactive"
oom_score_adj     = 200
apply_to_children = true

[[rule]]
name     = "electron"
priority = 55

[rule.match]
comm = ["electron", "code", "code-oss", "vscodium", "slack",
        "discord", "teams", "spotify", "obsidian", "signal"]

[rule.action]
cgroup            = "interactive"
oom_score_adj     = 300
apply_to_children = true

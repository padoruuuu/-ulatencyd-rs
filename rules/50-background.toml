# rules/50-background.toml
# Background and idle processes.

[[rule]]
name     = "package-managers"
priority = 50

[rule.match]
comm = ["apt", "apt-get", "dpkg", "rpm", "pacman", "yum", "dnf",
        "zypper", "xbps-install", "emerge", "portage"]

[rule.action]
cgroup        = "background"
nice          = 10
io_weight     = 50
oom_score_adj = 500
apply_to_children = true

[[rule]]
name     = "package-manager-build"
priority = 50

[rule.match]
parent_comm = ["apt", "dpkg", "pacman", "portage", "emerge"]

[rule.action]
cgroup    = "background"
nice      = 15
io_weight = 50

[[rule]]
name     = "updatedb-mlocate"
priority = 50

[rule.match]
comm = ["updatedb", "mlocate", "plocate"]

[rule.action]
cgroup        = "idle"
nice          = 19
io_weight     = 10
sched_policy  = "idle"

[[rule]]
name     = "backup-tools"
priority = 50

[rule.match]
comm = ["rsync", "borg", "rclone", "duplicati", "restic", "bup"]

[rule.action]
cgroup    = "background"
nice      = 15
io_weight = 50

[[rule]]
name     = "virus-scanners"
priority = 50

[rule.match]
comm = ["clamd", "freshclam", "clamdscan", "clamscan"]

[rule.action]
cgroup       = "idle"
nice         = 19
sched_policy = "idle"
io_weight    = 10

[[rule]]
name     = "build-systems"
priority = 50

[rule.match]
comm = ["make", "cmake", "ninja", "cargo", "rustc", "gcc", "g++",
        "clang", "clang++", "cc1", "cc1plus", "as", "ld"]

[rule.action]
cgroup = "background"
nice   = 10

[[rule]]
name     = "disk-intensive-idle"
priority = 45

[rule.match]
comm = ["find", "grep", "locate", "fd"]
min_rss_mb = 0

[rule.action]
cgroup       = "idle"
nice         = 19
sched_policy = "idle"
io_weight    = 10

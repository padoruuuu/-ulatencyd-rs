# rules/10-audio.toml
# Real-time audio servers and their clients.

[[rule]]
name     = "pipewire"
priority = 90

[rule.match]
comm = ["pipewire", "pipewire-pulse", "pipewire-alsa"]

[rule.action]
cgroup       = "rt"
sched_policy = "fifo"
sched_priority = 80
oom_score_adj = -900
apply_to_children = false

[[rule]]
name     = "wireplumber"
priority = 88

[rule.match]
comm = ["wireplumber"]

[rule.action]
cgroup       = "rt"
sched_policy = "fifo"
sched_priority = 70
oom_score_adj = -800

[[rule]]
name     = "jackd"
priority = 90

[rule.match]
comm = ["jackd", "jackdbus"]

[rule.action]
cgroup       = "rt"
sched_policy = "fifo"
sched_priority = 85
oom_score_adj = -900

[[rule]]
name     = "jack-client"
priority = 75

[rule.match]
parent_comm = ["jackd", "jackdbus"]

[rule.action]
cgroup       = "rt"
sched_policy = "fifo"
sched_priority = 60

[[rule]]
name     = "pulseaudio"
priority = 85

[rule.match]
comm = ["pulseaudio"]

[rule.action]
cgroup       = "rt"
sched_policy = "rr"
sched_priority = 50
oom_score_adj = -800

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  /etc/dbus-1/system.d/org.ulatencyd.Ulatencyd1.conf
  
  This file controls WHO CAN OWN the bus name and send/receive messages
  at the D-Bus protocol level. It is required on ALL init systems.
  
  This is separate from polkit (which controls fine-grained method
  authorization). Without this file, the daemon cannot register its
  D-Bus name and ulatencyctl will fail with ServiceUnknown.
-->
<busconfig>
  <!-- The daemon (runs as root) may own this name -->
  <policy user="root">
    <allow own="org.ulatencyd.Ulatencyd1"/>
    <allow send_destination="org.ulatencyd.Ulatencyd1"/>
    <allow receive_sender="org.ulatencyd.Ulatencyd1"/>
  </policy>

  <!-- Any active local user may call methods and receive signals.
       Fine-grained authorization is handled by polkit rules. -->
  <policy context="default">
    <allow send_destination="org.ulatencyd.Ulatencyd1"/>
    <allow receive_sender="org.ulatencyd.Ulatencyd1"/>
  </policy>
</busconfig>

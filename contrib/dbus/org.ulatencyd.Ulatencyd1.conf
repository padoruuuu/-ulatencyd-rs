<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  /etc/dbus-1/system.d/org.ulatencyd.Ulatencyd1.conf
  Install: sudo cp contrib/dbus/org.ulatencyd.Ulatencyd1.conf \
               /etc/dbus-1/system.d/org.ulatencyd.Ulatencyd1.conf
-->

<busconfig>
  <!-- ulatencyd daemon may own this name -->
  <policy user="root">
    <allow own="org.ulatencyd.Ulatencyd1"/>
    <allow send_destination="org.ulatencyd.Ulatencyd1"/>
    <allow receive_sender="org.ulatencyd.Ulatencyd1"/>
  </policy>

  <!-- All users may call non-privileged methods and receive signals -->
  <policy context="default">
    <allow send_destination="org.ulatencyd.Ulatencyd1"
           send_interface="org.ulatencyd.Ulatencyd1"
           send_member="GetDaemonStatus"/>
    <allow send_destination="org.ulatencyd.Ulatencyd1"
           send_interface="org.ulatencyd.Ulatencyd1"
           send_member="ListManagedProcesses"/>
    <allow send_destination="org.ulatencyd.Ulatencyd1"
           send_interface="org.ulatencyd.Ulatencyd1"
           send_member="GetProcessInfo"/>
    <allow send_destination="org.ulatencyd.Ulatencyd1"
           send_interface="org.ulatencyd.Ulatencyd1"
           send_member="GetSystemPressure"/>
    <allow receive_sender="org.ulatencyd.Ulatencyd1"/>
  </policy>

  <!-- Compositors / display managers: allow SetForegroundProcess -->
  <policy group="video">
    <allow send_destination="org.ulatencyd.Ulatencyd1"
           send_interface="org.ulatencyd.Ulatencyd1"
           send_member="SetForegroundProcess"/>
  </policy>

  <!-- wheel / sudo group: allow privileged operations -->
  <policy group="wheel">
    <allow send_destination="org.ulatencyd.Ulatencyd1"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.ulatencyd.Ulatencyd1"/>
  </policy>
</busconfig>

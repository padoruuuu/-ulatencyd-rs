<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own this name — the shim itself runs as root so it can
       reach the control socket's protected directory (see
       contrib/systemd/ulatencyd-system76-shim.service). -->
  <policy user="root">
    <allow own="com.system76.Scheduler"/>
  </policy>

  <!-- Any user may call the two compat methods — access control happens at
       the ulatencyd control-socket layer (Unix group membership), the same
       as it would for any other client of org.ulatencyd.Control. This mirrors
       the original system76-scheduler package's own D-Bus policy, which did
       not polkit-gate these two calls either. -->
  <policy context="default">
    <allow send_destination="com.system76.Scheduler"
           send_interface="com.system76.Scheduler"/>
  </policy>
</busconfig>
